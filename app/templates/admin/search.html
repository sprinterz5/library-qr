{% extends "admin/base.html" %}
{% set active_nav = "search" %}

{% block title %}Admin — Readers{% endblock %}

{% block admin_content %}
<div class="page-head">
    <div>
        <h1>Find a reader</h1>
        <p>Search the library system by name, email or library card number.</p>
    </div>
</div>

<form class="card search-bar" id="searchForm">
    <input id="readerSearch" placeholder="e.g. aidar, a.begotayev or 2100000004099" autocomplete="off" autofocus />
    <button type="submit" class="btn btn-primary" id="btnSearch">Search</button>
</form>
<div id="status" class="search-status"></div>
<div id="readerResults"></div>

<style>
    .search-bar { display: flex; gap: 10px; align-items: center; }
    .search-bar input { flex: 1; }
    .search-status { font-size: 14px; color: var(--text-muted); margin: 4px 2px 12px; min-height: 20px; }
    .reader { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .reader-name { font-weight: 600; font-size: 15px; }
</style>
{% endblock %}

{% block scripts %}
<script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let isSearching = false;

    async function searchReaders() {
        if (isSearching) return;
        const input = document.getElementById("readerSearch");
        const btn = document.getElementById("btnSearch");
        const status = document.getElementById("status");
        const results = document.getElementById("readerResults");
        const q = input.value.trim();
        if (q.length < 2) {
            status.textContent = "Type at least 2 characters.";
            return;
        }

        isSearching = true;
        btn.disabled = true;
        btn.textContent = "Searching…";
        status.textContent = "Searching the library system…";
        results.innerHTML = "";

        try {
            const res = await fetch(`/api/readers/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            const el = data.elibra;
            let readers = [];
            if (Array.isArray(el)) readers = el;
            else if (el && Array.isArray(el.result)) readers = el.result;
            else if (el && Array.isArray(el.results)) readers = el.results;

            if (data.error) {
                status.textContent = "Search failed: " + data.error;
                return;
            }
            if (!readers.length) {
                status.textContent = "No readers found.";
                return;
            }

            for (const item of readers.slice(0, 25)) {
                const fm = item.fieldModels || [];
                const get = (code) => (fm.find((x) => x.code === code) || {}).value || "";
                const card = get("LIBRARY_CARD_BARCODE");
                const div = document.createElement("div");
                div.className = "card reader";
                div.innerHTML = `
                    <div>
                        <div class="reader-name">${esc(get("FIRST_NAME"))} ${esc(get("LAST_NAME"))}</div>
                        <div class="row-small">ID ${esc(item.parentId)} · Card ${esc(card || "—")}</div>
                        <div class="row-small">${esc(get("EMAIL"))}</div>
                    </div>
                    ${card.length >= 5 ? `<div class="card-tail">${esc(card.slice(-5))}</div>` : ""}`;
                results.appendChild(div);
            }
            status.textContent = `Found ${readers.length} reader${readers.length === 1 ? "" : "s"}.`;
        } catch (error) {
            status.textContent = "Search failed. Please try again.";
            console.error("Search error:", error);
        } finally {
            isSearching = false;
            btn.disabled = false;
            btn.textContent = "Search";
        }
    }

    document.getElementById("searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        searchReaders();
    });
</script>
{% endblock %}
