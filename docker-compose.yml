services:
  elibra-middleware:
    build: .
    container_name: elibra-middleware
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./pw_profile:/app/pw_profile
      # App code and static files come from the checkout, so a code-only
      # deploy is `git pull && docker compose restart` (seconds). Rebuild the
      # image only when requirements.txt or the Dockerfile change.
      - ./app:/app/app:ro
      - ./img:/app/img:ro
      - ./pdf:/app/pdf:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    # Linux loop policy is fine by default
